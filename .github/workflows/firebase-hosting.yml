name: Deploy Mi Compra to Firebase Hosting (keyless)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'delosrios9301-cpu/Micompra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate keyless setup script syntax
        run: bash -n scripts/setup-firebase-wif.sh
      - name: Install Firestore emulator test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund firebase-tools@15.36.0 @firebase/rules-unit-testing@5.0.0
      - name: Verify Firestore security rules in emulator
        run: npx firebase emulators:exec --only firestore --project demo-mi-compra-rules --non-interactive "node --test src/v2/firestore.rules.integration.js"
      - name: Run application tests
        run: npm test
      - name: Build Vite for production (Firebase root)
        run: npm run build
        env:
          VITE_BASE_PATH: /
      - name: Verify that all application scripts use Firebase root paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path('dist/index.html').read_text(encoding='utf-8')
          assert '/Micompra/' not in html, 'El build contiene rutas de GitHub Pages y no funcionará en Firebase.'
          sources = re.findall(r'<script[^>]+src="([^"]+)"', html)
          assert sources, 'El HTML publicado no contiene los scripts de la aplicación.'
          for src in sources:
              assert src.startswith('/assets/'), f'Ruta incorrecta en Firebase: {src}'
              assert Path('dist', src.lstrip('/')).is_file(), f'Falta el recurso generado: {src}'
          print('OK: los scripts existen y sus URLs son válidas para Firebase Hosting.')
          PY
      - name: Upload build for deployment
        uses: actions/upload-artifact@v4
        with:
          name: mi-compra-hosting-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: verify
    if: github.repository == 'delosrios9301-cpu/Micompra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Firebase hosting configuration
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download verified build
        uses: actions/download-artifact@v4
        with:
          name: mi-compra-hosting-dist
          path: dist
      - name: Check one-time Workload Identity Federation setup
        env:
          GCP_PROJECT_NUMBER: ${{ vars.FIREBASE_GCP_PROJECT_NUMBER }}
        run: |
          if ! [[ "$GCP_PROJECT_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Falta la variable FIREBASE_GCP_PROJECT_NUMBER. Ejecuta scripts/setup-firebase-wif.sh en Google Cloud Shell y guarda el número en Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
      - name: Authenticate with Google Cloud (OIDC, no private keys)
        uses: google-github-actions/auth@v3
        with:
          project_id: mi-compra-d9717
          workload_identity_provider: projects/${{ vars.FIREBASE_GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/mi-compra-github/providers/mi-compra-main
          service_account: mi-compra-hosting-gh@mi-compra-d9717.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - name: Deploy ONLY Firebase Hosting (never Firestore)
        run: npx --yes firebase-tools@15.36.0 deploy --only hosting --project mi-compra-d9717 --non-interactive
      - name: Confirm public page loads its main JavaScript bundle
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys
          import time
          import urllib.request

          origin = 'https://mi-compra-d9717.web.app'
          for attempt in range(1, 7):
              try:
                  request = urllib.request.Request(origin + '/?deploy=' + os.environ['GITHUB_SHA'][:12], headers={'Cache-Control': 'no-cache'})
                  with urllib.request.urlopen(request, timeout=25) as response:
                      html = response.read().decode('utf-8')
                  scripts = re.findall(r'<script[^>]+src="(/assets/[^"]+\.js)"', html)
                  if not scripts:
                      raise RuntimeError('El HTML público no incluye JavaScript bajo /assets/.')
                  for path in scripts:
                      with urllib.request.urlopen(origin + path, timeout=25) as response:
                          if response.status != 200:
                              raise RuntimeError(f'JavaScript inaccesible: {path}, HTTP {response.status}')
                          payload = response.read(256)
                          if b'<!doctype html' in payload.lower() or b'<html' in payload.lower():
                              raise RuntimeError(f'Se devolvió HTML en vez de JavaScript para {path}')
                  print(f'OK: página pública y {len(scripts)} recurso(s) JavaScript accesibles en Firebase.')
                  break
              except Exception as error:
                  if attempt == 6:
                      print(f'::error::El sitio público no carga correctamente: {error}')
                      sys.exit(1)
                  print(f'Intento {attempt}/6: {error}; se reintentará en 10 segundos.')
                  time.sleep(10)
          PY
