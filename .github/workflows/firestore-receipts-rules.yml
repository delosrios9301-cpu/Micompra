name: Validate and publish Firestore receipt permissions

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - .github/workflows/firestore-receipts-rules.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mi-compra-firestore-rules
  cancel-in-progress: false

jobs:
  verify-and-publish-rules:
    if: github.repository == 'delosrios9301-cpu/Micompra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-package-lock --no-audit --no-fund firebase-tools@15.36.0 @firebase/rules-unit-testing@5.0.0
      - name: Validate Firestore security rules with emulator
        run: npx firebase emulators:exec --only firestore --project demo-mi-compra-rules --non-interactive "node --test src/v2/firestore.rules.integration.js"
      - name: Run application regression tests
        run: npm test
      - name: Authenticate ONLY to publish security rules (OIDC, no JSON keys)
        uses: google-github-actions/auth@v3
        with:
          project_id: mi-compra-d9717
          workload_identity_provider: projects/993392968752/locations/global/workloadIdentityPools/github-mi-compra/providers/github
          service_account: github-mi-compra-deploy@mi-compra-d9717.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: mi-compra-d9717
      - name: Publish Firestore rules only (never documents or Hosting)
        env:
          GOOGLE_CLOUD_PROJECT: mi-compra-d9717
        run: |
          python3 <<'PY'
          import json
          import os
          import subprocess
          import urllib.request
          import urllib.error

          project = os.environ["GOOGLE_CLOUD_PROJECT"]
          token = subprocess.check_output(["gcloud", "auth", "print-access-token"], text=True).strip()
          base = f"https://firebaserules.googleapis.com/v1/projects/{project}"
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          def call(url, method="GET", body=None):
              data = None if body is None else json.dumps(body).encode()
              request = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      raw = response.read()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as error:
                  detail = error.read().decode("utf-8", "replace")
                  raise SystemExit(f"Firestore Rules API {error.code}: {detail}")

          with open("firestore.rules", encoding="utf-8") as file:
              source = file.read()
          ruleset = call(base + "/rulesets", "POST", {
              "source": {"files": [{"name": "firestore.rules", "content": source}]}
          })
          ruleset_name = ruleset["name"]
          release_path = base + "/releases/cloud.firestore"
          release = {"name": f"projects/{project}/releases/cloud.firestore", "rulesetName": ruleset_name}
          try:
              call(release_path, "PATCH", {"release": release, "updateMask": "rulesetName"})
          except SystemExit as error:
              if "404" not in str(error):
                  raise
              call(base + "/releases?releaseId=cloud.firestore", "POST", release)

          confirmed = call(release_path)
          if confirmed.get("rulesetName") != ruleset_name:
              raise SystemExit("No se pudo comprobar el conjunto de reglas publicado.")
          print(f"OK: permisos Firestore publicados y verificados ({ruleset_name}).")
          print("No se modificaron documentos, cuentas, compras ni Cloud Storage.")
          PY
