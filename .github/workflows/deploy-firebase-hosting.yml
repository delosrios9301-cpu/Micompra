name: Deploy Mi Compra to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/993392968752/locations/global/workloadIdentityPools/github-mi-compra/providers/github
          service_account: github-mi-compra-deploy@mi-compra-d9717.iam.gserviceaccount.com

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build for Firebase Hosting
        run: npm run build
        env:
          VITE_BASE_PATH: /

      - name: Deploy to Firebase Hosting
        run: npx --yes firebase-tools@15.22.1 deploy --only hosting --project mi-compra-d9717 --non-interactive
