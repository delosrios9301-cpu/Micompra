name: Build Mi Compra
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Firebase Emulator test dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund firebase-tools @firebase/rules-unit-testing
      - name: Run Firestore security integration tests
        run: npx firebase emulators:exec --only firestore --project demo-mi-compra-rules --non-interactive "node --test src/v2/firestore.rules.test.js"
      - name: Run application tests
        run: npm test
      - name: Build production bundle
        run: npm run build
